version: '3.8'

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lokah_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=lokah_builders
      - DB_USER=root
      - DB_PASSWORD=your_password
      # Required — server refuses to start in production without these (see server/config/validateEnv.js)
      - JWT_SECRET=your_jwt_access_secret_key_here
      - JWT_REFRESH_SECRET=your_jwt_refresh_secret_key_here
      - COOKIE_SECRET=your_cookie_secret_signature_here
      - FRONTEND_URL=https://YOUR-PRODUCTION-DOMAIN
      - ADMIN_EMAIL=admin@lokahbuilders.com
      - ADMIN_NAME=Administrator
      - ADMIN_PASSWORD=set_a_strong_password_here
      # Required for password-reset emails to actually send (see server/utils/email.js)
      - SMTP_HOST=
      - SMTP_PORT=
      - SMTP_USER=
      - SMTP_PASS=
      - SMTP_FROM=
    volumes:
      - ./server/public/uploads:/usr/src/app/public/uploads

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lokah_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
